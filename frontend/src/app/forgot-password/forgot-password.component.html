<section class="auth-page">
  <div class="auth-ambiance" aria-hidden="true"></div>

  <div class="auth-shell">
    <header class="auth-brand">
      <p class="brand-mark">Talkzen</p>
      <h1 class="brand-title">Forgot password</h1>
      <p class="brand-copy">Enter your account email to reset your password.</p>
    </header>

    <form class="auth-panel" (ngSubmit)="submit()">
      <div class="field">
        <label for="forgot-email">Email</label>
        <input
          id="forgot-email"
          #emailControl="ngModel"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          email
          required
        />
        <div
          class="field-error"
          *ngIf="emailControl.invalid && (emailControl.dirty || emailControl.touched)"
        >
          <span *ngIf="emailControl.errors?.['required']">Email is required</span>
          <span *ngIf="emailControl.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="form-success" *ngIf="successMessage">{{ successMessage }}</p>

      <button
        class="btn-primary"
        type="submit"
        [disabled]="emailControl.invalid || loading"
      >
        {{ loading ? 'Please wait...' : 'Continue' }}
      </button>

      <p class="auth-link">
        Remembered it?
        <a routerLink="/">Back to sign in</a>
      </p>
    </form>
  </div>
</section>
