<div class="password-shell">
  <div class="password-icon" aria-hidden="true">
    <mat-icon>lock</mat-icon>
  </div>
  <h2>Change password</h2>
  <p>Use a strong password with letters, a number, and a symbol.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Current password
      <input type="password" formControlName="currentPassword" placeholder="••••••••" />
    </label>
    <label>
      New password
      <input type="password" formControlName="newPassword" placeholder="Create a new password" />
    </label>
    <label>
      Confirm password
      <input type="password" formControlName="confirmPassword" placeholder="Repeat new password" />
    </label>

    <p class="error" *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
      Passwords must match
    </p>
    <p
      class="error"
      *ngIf="form.hasError('samePassword') && (form.get('newPassword')?.touched || form.get('currentPassword')?.touched)"
    >
      You already have this password
    </p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

    <div class="actions">
      <button class="btn-cancel" type="button" (click)="close()">Cancel</button>
      <button class="btn-save" type="submit" [disabled]="saving || form.invalid">
        {{ saving ? 'Saving...' : 'Update password' }}
      </button>
    </div>
  </form>
</div>
