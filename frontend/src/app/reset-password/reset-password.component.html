<section class="auth-page">
  <div class="auth-ambiance" aria-hidden="true"></div>

  <div class="auth-shell">
    <header class="auth-brand">
      <p class="brand-mark">Talkzen</p>
      <h1 class="brand-title">Set new password</h1>
      <p class="brand-copy">Choose a strong password for your Talkzen account.</p>
    </header>

    <form class="auth-panel" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="reset-password">New password</label>
        <input
          id="reset-password"
          type="password"
          formControlName="newPassword"
          placeholder="Create a new password"
        />
        <div
          class="field-error"
          *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
        >
          <span *ngIf="form.get('newPassword')?.errors?.['required']">
            Password is required
          </span>
          <span *ngIf="form.get('newPassword')?.errors?.['minlength']">
            Password must be at least 8 characters
          </span>
          <span *ngIf="form.get('newPassword')?.errors?.['pattern']">
            Use letters, a number, and a symbol (e.g. @)
          </span>
        </div>
      </div>

      <div class="field">
        <label for="reset-confirm">Confirm password</label>
        <input
          id="reset-confirm"
          type="password"
          formControlName="confirmPassword"
          placeholder="Repeat new password"
        />
        <div
          class="field-error"
          *ngIf="form.get('confirmPassword')?.touched && form.hasError('passwordMismatch')"
        >
          Passwords must match
        </div>
      </div>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="form-success" *ngIf="successMessage">{{ successMessage }}</p>

      <button
        class="btn-primary"
        type="submit"
        [disabled]="!token || form.invalid || loading"
      >
        {{ loading ? 'Updating...' : 'Update password' }}
      </button>

      <p class="auth-link">
        <a routerLink="/">Back to sign in</a>
      </p>
    </form>
  </div>
</section>
